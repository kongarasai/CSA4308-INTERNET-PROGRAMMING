<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Citizen Registration - CivicConnect</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navigation Header -->
  <header class="header-nav">
    <div class="nav-container">
      <a href="index.html" class="brand-logo">🏛️ CivicConnect</a>
      <nav>
        <ul class="nav-menu">
          <li><a href="index.html" class="nav-link">Home</a></li>
          <li><a href="complaint.html" class="nav-link">Report Issue</a></li>
          <li><a href="tracker.html" class="nav-link">Track Status</a></li>
          <li><a href="login.html" class="nav-link">Login</a></li>
          <li><button type="button" class="dark-toggle-btn" id="dark-mode-toggle">🌙 Dark Mode</button></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container" style="max-width: 540px; margin-top: 2rem;">
    <div class="card">
      <h2 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; text-align: center;">Citizen Account Registration</h2>
      <p style="color: var(--text-secondary); text-align: center; margin-bottom: 1.5rem; font-size: 0.9rem;">
        Register to lodge civic complaints and track resolution SLAs in real time.
      </p>

      <div id="register-alert" class="alert" style="display: none;"></div>

      <form id="register-form">
        <div class="form-group" id="name-group">
          <label for="name" class="form-label">Full Name *</label>
          <input type="text" id="name" name="name" class="form-control" placeholder="e.g., Rajesh Kumar" required>
        </div>

        <div class="form-group" id="mobile-group">
          <label for="mobile" class="form-label">10-Digit Mobile Number (Indian Regex) *</label>
          <input type="tel" id="mobile" name="mobile" class="form-control" placeholder="e.g., 9876543210" required>
          <span class="error-text">Must be 10 digits starting with 6-9.</span>
        </div>

        <div class="form-group" id="email-group">
          <label for="email" class="form-label">Email Address *</label>
          <input type="email" id="email" name="email" class="form-control" placeholder="e.g., rajesh@example.com" required>
        </div>

        <div class="form-group" id="pincode-group">
          <label for="pincode" class="form-label">Municipal PIN Code (6 Digits) *</label>
          <input type="text" id="pincode" name="pincode" class="form-control" placeholder="e.g., 560001" required>
          <span class="error-text">Must be a valid 6-digit Indian PIN code.</span>
        </div>

        <div class="form-group" id="password-group">
          <label for="password" class="form-label">Create Password *</label>
          <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Register Account</button>
      </form>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container" style="margin: 0 auto;">
      <p>&copy; 2026 CivicConnect Platform</p>
    </div>
  </footer>

  <script src="js/main.js"></script>
  <script>
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const formData = new URLSearchParams(new FormData(form));

      try {
        const response = await fetch('api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: formData.toString()
        });

        const data = await response.json();
        const alert = document.getElementById('register-alert');

        if (response.ok && data.success) {
          alert.className = 'alert alert-success';
          alert.innerHTML = `✅ Registration successful! Your Citizen ID is <strong>${data.citizenId}</strong>. You can now login.`;
          alert.style.display = 'block';
          form.reset();
        } else {
          alert.className = 'alert alert-error';
          alert.textContent = data.message || 'Registration failed.';
          alert.style.display = 'block';
        }
      } catch (err) {
        console.error('Registration error:', err);
      }
    });
  </script>
</body>
</html>
